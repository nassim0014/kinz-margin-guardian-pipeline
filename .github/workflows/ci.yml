name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pydantic SQLAlchemy
          # API test deps (item 7.4 from handoff): the 22 API tests skip
          # gracefully via pytest.importorskip if these aren't installed.
          # Installing them lets the tests actually run in CI.
          pip install fastapi httpx PyJWT slowapi
          # Install src package for imports
          pip install -e .

      - name: Syntax-check all Python files
        run: |
          find src api airflow dashboard scripts -name "*.py" -print0 | xargs -0 -n1 python -m py_compile
          echo "✅ All files compile cleanly"

      - name: Run pytest suite
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f api/Dockerfile -t kinz-api:test .
      - name: Build Dashboard image
        run: docker build -f dashboard/Dockerfile -t kinz-dashboard:test .
