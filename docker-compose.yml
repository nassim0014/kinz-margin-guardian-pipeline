# ============================================================
# Kinz Margin Guardian Pipeline — Docker Compose
# Full stack: Airflow + Postgres + FastAPI + Streamlit
# ============================================================

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: kinz-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinz_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-margin_guardian}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinz_guardian}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinz-net

  # ---- Airflow Init (one-shot) ----
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: kinz-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-kinz_guardian}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-margin_guardian}
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --firstname Nassim --lastname K --role Admin --email admin@kinzoils.com --password admin || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./src:/opt/airflow/src:ro
      - ./scripts:/opt/airflow/scripts:ro
    networks:
      - kinz-net

  # ---- Airflow Webserver ----
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: kinz-airflow-web
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-kinz_guardian}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-margin_guardian}
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__WEBSERVER__SECRET_KEY: "kinz-guardian-secret"
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kinz_guardian}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-margin_guardian}
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./src:/opt/airflow/src:ro
      - ./scripts:/opt/airflow/scripts:ro
    command: airflow webserver --port 8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - kinz-net

  # ---- Airflow Scheduler ----
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: kinz-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-kinz_guardian}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-margin_guardian}
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kinz_guardian}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-margin_guardian}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/plugins:/opt/airflow/plugins:ro
      - ./src:/opt/airflow/src:ro
      - ./scripts:/opt/airflow/scripts:ro
    command: airflow scheduler
    networks:
      - kinz-net

  # ---- FastAPI Backend ----
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: kinz-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kinz_guardian}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-margin_guardian}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production-please}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      API_USER: ${API_USER:-admin@kinzoils.com}
      API_PASSWORD: ${API_PASSWORD:-change_me_in_prod}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    networks:
      - kinz-net

  # ---- Streamlit Dashboard ----
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: kinz-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kinz_guardian}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-margin_guardian}
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard:ro
      - ./src:/app/src:ro
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    networks:
      - kinz-net

volumes:
  pgdata:

networks:
  kinz-net:
    driver: bridge
